[project]
name = "astrbot-plugin-github-bridge"
version = "1.2.0"
description = "AstrBot GitHub monitoring, private notification and issue feedback plugin"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
